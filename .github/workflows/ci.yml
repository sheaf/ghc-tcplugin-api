name: CI

# Trigger the workflow on push or pull request, but only for the main branch
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Don't keep running superseded builds of a branch, but never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cabal:
    name: ${{ matrix.cfg.os }} / ghc ${{ matrix.cfg.ghc }}
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      # Always run the whole matrix so that we get all errors at once.
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-latest  , ghc: "9.14.1" , examples: true , docs: true  }
          - { os: ubuntu-latest  , ghc: "9.12.4" , examples: true , eqsat: true } # only build eqsat on 9.12 for now
          - { os: ubuntu-latest  , ghc: "9.10.3" , examples: true               }
          - { os: ubuntu-latest  , ghc: "9.8.4"  , examples: true               }
          - { os: ubuntu-latest  , ghc: "9.6.7"  , examples: true               }
          - { os: ubuntu-latest  , ghc: "9.4.8"  , examples: true               }
          - { os: ubuntu-latest  , ghc: "9.2.8"  , examples: true               }
          - { os: ubuntu-latest  , ghc: "9.0.2"  , examples: true               }
          - { os: ubuntu-latest  , ghc: "8.10.7" , examples: true               }
          - { os: ubuntu-latest  , ghc: "8.8.4" } # skip examples: needs StandaloneKindSignatures
          - { os: macOS-latest   , ghc: "9.12.4" , examples: true               }
          - { os: windows-latest , ghc: "9.14.1" , examples: true               }

    steps:
      - uses: actions/checkout@v7

      - name: Set up GHC ${{ matrix.cfg.ghc }}
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.cfg.ghc }}
          # Defaults, added for clarity:
          cabal-version: 'latest'
          cabal-update: true

      - name: Configure the build
        run: cabal configure --disable-documentation

      - name: Build ghc-tcplugin-api
        run: cabal build ghc-tcplugin-api

      - name: Build the documentation
        if: matrix.cfg.docs
        run: cabal haddock ghc-tcplugin-api

      - name: Build and lint System F example
        if: matrix.cfg.examples
        working-directory: ./examples/SystemF
        run: cabal build system-f

      - name: Build and lint rewriter plugin example
        if: matrix.cfg.examples
        working-directory: ./examples/RewriterPlugin
        run: cabal build lib:RewriterPlugin

      - name: Build and lint equality saturation example
        if: matrix.cfg.eqsat
        working-directory: ./examples/EqSat
        run: cabal build eq-sat
